apiVersion: apps/v1
kind: Deployment
metadata: 
  name: auth-service
  namespace: togglemaster
  labels: app: auth-service
  app.kubernetes.io/part-of: togglemaster
spec:
replicas: 1

selector:
  matchLabels:
  app: auth-service
   
template:
  metadata:
    labels:
      app: auth-service
      
  spec:
    containers:
      -name: auth-service
       image: AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/auth-service:initial
       imagePullPolicy: IfNotPresent

       ports:
       - name: http 
         containerPOrt: 8001     

      env:
        -name: PORT 
         valueFrom:
           configMapKeyRef:
             name: togglemaster-config
             key: AUTH_PORT

        - name: DATABASE_URL
          valueFrom: 
            secretKeyRef:
              name: togglemaster-secrets
              key: AUTH_DATABASE_URL
                    
        - name: MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: togglemaster-secrets
              key: MASTER_KEY

      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "250m"
          memory: "256Mi"

      readinessProbe:
        httpGet:
          path: /health
          port: http      
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 6  

      livenessProbe:
        httpGet:
          path: /health
          port: http  
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 3
        failureThreshold: 3  
