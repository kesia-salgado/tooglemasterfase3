apiVersion: app/v1
kind: Deployment
metadata:
  name: flag-service
  namespace: togglemaster
  labels:
    app: flag-service
    app.kubernetes.io/part-of: togglemaster
spec:
  replicas: 1

  selector:
    matchLabels:
      app: flag-service

  template:
    metadatta:
      labels:
        app:  flag-service

    spec:
      containers:
        - name: flag-service
          image: AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/flag-service:initial
          imagePullPolicy: IfNotPresent


          ports:
            - name: http
              containerPort: 8002
          
          env:
            - name: PORT
              valueFrom:
                configMapKey:
                  name: togglemaster-config
                  key: FLAG_PORT

            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: togglemaster-config
                  key: AUTH_SERVICE_URL
            
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: togglemaster-config
                  key: AUTH_SERVICE_URL

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits: 
              cpu: "250m"
              memory: "256Mi"
          
          readinessProbe:
            httpGet:
              path: /health
              port: http
               initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
            
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
            
