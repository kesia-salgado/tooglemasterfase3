apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: evaluation-service-hpa
  namespace: togglemaster
spec:
  scaleTargetRef:
    apiVersion: app/v1
    kind: Deployment
    name: evaluation-service
  
  minReplicas: 1
  maxReplicas: 4
  
  behavior:
    scaleDown:
      stabilizationWindowsSeconds: 300
  
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60